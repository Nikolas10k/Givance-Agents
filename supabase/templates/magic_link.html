<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f6f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #1c2024;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #dfe3e6;
        border-radius: 8px;
      "
    >
      <tr>
        <td style="padding: 32px">
          <p style="margin: 0 0 16px; font-size: 16px; font-weight: bold">Givance Workforce</p>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 22px">
            Use o botão abaixo para entrar no painel. O link vale por uma hora e só funciona uma
            vez.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                padding: 12px 20px;
                background: #1f4e5f;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-size: 15px;
              "
              >Entrar no painel</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 20px; color: #5c6670">
            Se você não pediu este acesso, pode ignorar este e-mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
